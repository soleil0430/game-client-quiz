<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 클라이언트 면접 퀴즈</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#2f6feb; --ok:#1a7f37; --bad:#cf222e; --machine:#e5484d; --machine-dark:#a3262c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8d96a0; --line:#30363d; --accent:#4493f8; --ok:#3fb950; --bad:#f85149; --machine:#d93d42; --machine-dark:#7d1c21; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .row { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
  .center { text-align: center; justify-content: center; }
  .end { justify-content: flex-end; margin-top: 12px; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  button.primary { padding: 10px 20px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.primary:disabled { opacity: .4; cursor: default; }
  button.link { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-size: .9rem; cursor: pointer; }

  /* 분야 선택 (좁은 화면에서는 접힌 채로 시작) */
  summary { cursor: pointer; padding: 4px 0; }
  details[open] summary { margin-bottom: 6px; }
  .topics { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .topic { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: .9rem; cursor: pointer; user-select: none; }
  .topic input { margin: 0; accent-color: var(--accent); }
  .topic small { color: var(--muted); }

  /* 뽑기 기계 */
  .stage { position: relative; display: flex; justify-content: center; margin: 8px 0 0; }
  #machine { width: 220px; max-width: 70%; cursor: pointer; overflow: visible; outline: none; }
  #machine.off { cursor: not-allowed; opacity: .4; }
  #machine .glass { fill: color-mix(in srgb, var(--card) 65%, transparent); stroke: var(--line); stroke-width: 3; }
  #machine .body { fill: var(--machine); }
  #machine .dark { fill: var(--machine-dark); }
  #machine .knob { fill: var(--card); stroke: var(--machine-dark); stroke-width: 4; }
  #dome, #knob, #capsule { transform-box: fill-box; transform-origin: center; }
  #dome { transform-origin: center bottom; }
  #capsule { opacity: 0; }
  #machine.pull #knob { animation: turn .5s ease-in-out; }
  #machine.pull #dome { animation: shake .5s ease-in-out; }
  #machine.pull #capsule { animation: spit .7s .45s cubic-bezier(.3, 1.6, .5, 1) forwards; }
  .bubble { position: absolute; top: 76%; left: calc(50% + 36px); padding: 0 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-weight: 700; opacity: 0; pointer-events: none; }
  .stage.pull .bubble { animation: pop .8s .6s ease-out forwards; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes shake { 20%, 60% { transform: rotate(-4deg); } 40%, 80% { transform: rotate(4deg); } }
  @keyframes spit { 0% { opacity: 1; transform: translateY(0) scale(.5); } 60% { opacity: 1; transform: translateY(36px) scale(1.25); } 100% { opacity: 1; transform: translateY(28px) scale(1.1); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 35% { opacity: 1; transform: translateY(-6px) scale(1.1); } 100% { opacity: 0; transform: translateY(-14px); } }

  /* 문제 */
  #quiz:not([hidden]) { animation: appear .35s ease-out; }
  @keyframes appear { from { opacity: 0; transform: translateY(12px) scale(.97); } }
  .question { white-space: pre-wrap; font-size: 1.05rem; margin: 8px 0 16px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; background: color-mix(in srgb, var(--line) 45%, transparent); padding: 1px 5px; border-radius: 4px; }
  .choice { display: block; width: 100%; text-align: left; white-space: pre-wrap; margin: 8px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  .choice:not(:disabled):hover { border-color: var(--accent); }
  .choice:disabled { cursor: default; }
  .choice.picked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .choice.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .choice.dim { opacity: .55; }
  .choice b { color: var(--muted); margin-right: 8px; }
  .feedback { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: color-mix(in srgb, var(--line) 30%, transparent); }
  .feedback p { margin: 6px 0 0; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 24px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; animation-delay: 0s !important; } }
</style>
</head>

<main>

    <p id="invalid" class="bad" hidden></p>
  </section>

  <section id="quiz" class="card" hidden>
    <div class="row muted"><span id="topic"></span><span id="source"></span></div>
    <div id="question" class="question"></div>
    <div id="choices"></div>
    <div id="feedback" class="feedback" hidden></div>
    <div class="row end"><button id="next" class="primary" disabled>제출</button></div>
  </section>

  <footer>공개된 면접 질문 목록을 참고해 새로 만든 문제입니다. 정답과 해설이 틀릴 수 있습니다. 기계를 누르거나 Enter로 뽑고, 숫자 키 1~5로 고른 뒤 Enter로 제출할 수 있습니다. 진행 상황은 이 브라우저에 저장됩니다.</footer>
</main>

<script>
const LABELS = ["①", "②", "③", "④", "⑤"];
const STORE = "game-client-quiz";
const $ = (id) => document.getElementById(id);

// 문제 형식이 잘못됐으면 이유를, 괜찮으면 빈 문자열을 돌려준다
function problemOf(q) {
  if (!q || typeof q.id !== "string" || !q.id) return "id 없음";
  for (const key of ["topic", "source", "question", "explanation"]) {
    if (typeof q[key] !== "string" || !q[key].trim()) return `${key} 비어 있음`;
  }
  if (!Array.isArray(q.choices) || q.choices.length !== 5 || new Set(q.choices).size !== 5
      || !q.choices.every((c) => typeof c === "string" && c.trim())) return "보기는 서로 다른 문자열 5개여야 함";
  if (!Number.isInteger(q.answer) || q.answer < 0 || q.answer > 4) return "answer는 0~4 정수여야 함";
  return "";
}

// 형식이 잘못됐거나 id가 겹치는 문제는 빼고, 첫 화면에 알린다
const seen = new Set(), invalid = [];
const QUESTIONS = (window.QUESTIONS || []).filter((q, i) => {
  const problem = problemOf(q) || (seen.has(q.id) ? "id 중복" : "");
  if (problem) invalid.push(`${(q && q.id) || i + 1 + "번째 문제"}: ${problem}`);
  seen.add(q && q.id);
  return !problem;
});
const TOPICS = [...new Set(QUESTIONS.map((q) => q.topic))];

// 진행 상황: 고른 분야, 이번 회차에 푼 문제(id → 맞혔는지), 푼 기록 전체
let state = { selected: TOPICS, solved: {}, history: [] };
try { state = { ...state, ...JSON.parse(localStorage.getItem(STORE)) }; } catch {}
state.selected = state.selected.filter((t) => TOPICS.includes(t));
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} };

let current = null, pulling = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// HTML을 이스케이프한 뒤 `백틱`으로 감싼 부분만 코드로 표시한다
const format = (text) => String(text)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/`([^`]+)`/g, "<code>$1</code>");

// "2026-09-15 14:32:05" 형식의 현지 시각
const now = () => new Date().toLocaleString("sv-SE");

const pool = () => QUESTIONS.filter((q) => state.selected.includes(q.topic));
const remaining = () => pool().filter((q) => !(q.id in state.solved));

function renderHome() {
  // 고른 분야를 모두 풀었으면 결과를 알리고 처음부터 다시 섞는다
  const inPool = pool();
  if (inPool.length && !remaining().length) {
    const correct = inPool.filter((q) => state.solved[q.id]).length;
    inPool.forEach((q) => delete state.solved[q.id]);
    save();
    $("notice").textContent = `고른 분야의 ${inPool.length}문제를 모두 풀었습니다 (정답 ${correct}개). 처음부터 다시 섞었습니다.`;
    $("notice").hidden = false;
  }

  $("topics").innerHTML = "";
  TOPICS.forEach((topic) => {
    const all = QUESTIONS.filter((q) => q.topic === topic);
    const done = all.filter((q) => q.id in state.solved).length;
    const label = document.createElement("label");
    label.className = "topic";
    label.innerHTML = `<input type="checkbox"${state.selected.includes(topic) ? " checked" : ""}>${format(topic)} <small>${done}/${all.length}</small>`;
    label.querySelector("input").onchange = (e) => {
      state.selected = e.target.checked ? [...state.selected, topic] : state.selected.filter((t) => t !== topic);
      save();
      renderHome();
    };
    $("topics").append(label);
  });

  const answered = inPool.filter((q) => q.id in state.solved);
  $("toggleAll").textContent = state.selected.length === TOPICS.length ? "전체 해제" : "전체 선택";
  $("topicSummary").textContent = `${TOPICS.length}개 중 ${state.selected.length}개 선택`;
  $("machine").classList.toggle("off", !inPool.length);
  $("status").textContent = inPool.length
    ? `남은 문제 ${remaining().length} / ${inPool.length} · 이번 회차 정답 ${answered.filter((q) => state.solved[q.id]).length} / ${answered.length}`
    : "분야를 하나 이상 고르세요";
  $("download").hidden = !state.history.length;
}

function pull() {
  const left = remaining();
  if (pulling || !left.length) return;
  pulling = true;
  $("notice").hidden = true;
  const q = left[Math.floor(Math.random() * left.length)];
  current = { q, order: shuffle([0, 1, 2, 3, 4]), selected: null, chosen: null };
  $("machine").classList.add("pull");
  $("stage").classList.add("pull");
  const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1300;
  setTimeout(() => {
    $("machine").classList.remove("pull");
    $("stage").classList.remove("pull");
    pulling = false;
    $("home").hidden = true;
    $("quiz").hidden = false;
    show();
    window.scrollTo(0, 0);
  }, delay);
}

function show() {
  const { q, order, selected, chosen } = current;
  const answered = chosen !== null;
  $("topic").textContent = q.topic;
  $("source").textContent = q.source;
  $("question").innerHTML = format(q.question);
  $("choices").innerHTML = "";
  order.forEach((original, i) => {
    // 제출 전: 고른 보기만 강조. 제출 후: 정답은 초록 ✓, 고른 오답은 빨강 ✗, 나머지는 흐리게
    const mood = !answered ? (original === selected ? "picked" : "")
      : original === q.answer ? "right" : original === chosen ? "wrong" : "dim";
    const mark = { right: ' <span class="ok">✓</span>', wrong: ' <span class="bad">✗</span>' }[mood] || "";
    const button = document.createElement("button");
    button.className = `choice ${mood}`;
    button.disabled = answered;
    button.innerHTML = `<b>${LABELS[i]}</b>${format(q.choices[original])}${mark}`;
    button.onclick = () => pick(original);
    $("choices").append(button);
  });
  $("feedback").hidden = !answered;
  if (answered) {
    const correct = chosen === q.answer;
    $("feedback").innerHTML = `<strong class="${correct ? "ok" : "bad"}">${correct ? "정답입니다" : "오답입니다"}</strong><p>${format(q.explanation)}</p>`;
  }
  $("next").textContent = answered ? "다시 뽑기" : "제출";
  $("next").disabled = !answered && selected === null;
}

// 보기를 고른다. 제출 전에는 몇 번이든 바꿀 수 있다
function pick(original) {
  if (!current || current.chosen !== null) return;
  current.selected = original;
  show();
}

// 고른 보기를 채점하고 해설을 보여준다. 제출한 답은 바꿀 수 없다
function submit() {
  const { q, selected } = current;
  current.chosen = selected;
  state.solved[q.id] = selected === q.answer;
  state.history.push({ at: now(), id: q.id, topic: q.topic, chosen: selected, answer: q.answer, correct: selected === q.answer });
  save();
  show();
  $("feedback").scrollIntoView({ block: "nearest" });
}

// 제출 전에는 제출, 제출 후에는 첫 화면으로 돌아가 다시 뽑는다
$("next").onclick = () => {
  if (!current) return;
  if (current.chosen === null) {
    if (current.selected !== null) submit();
    return;
  }
  $("quiz").hidden = true;
  $("home").hidden = false;
  renderHome();
  window.scrollTo(0, 0);
};

$("machine").onclick = pull;

$("toggleAll").onclick = () => {
  state.selected = state.selected.length === TOPICS.length ? [] : [...TOPICS];
  save();
  renderHome();
};

document.addEventListener("keydown", (e) => {
  if (["INPUT", "BUTTON"].includes(e.target.tagName)) return;
  if (!$("home").hidden && e.key === "Enter") pull();
  else if (!$("quiz").hidden && e.key >= "1" && e.key <= "5") pick(current.order[Number(e.key) - 1]);
  else if (!$("quiz").hidden && e.key === "Enter") $("next").click();
});

// 푼 기록 전체를 JSON 파일로 내려받는다 (브라우저의 다운로드 폴더에 저장된다)
$("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([JSON.stringify(state.history, null, 2)], { type: "application/json" }));
  link.download = `퀴즈기록_${now().replace(" ", "_").replace(/:/g, "-")}.json`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
};

$("topicBox").open = matchMedia("(min-width: 600px)").matches;
if (!QUESTIONS.length) $("loadError").hidden = false;
if (invalid.length) {
  $("invalid").hidden = false;
  $("invalid").textContent = `형식이 잘못된 문제 ${invalid.length}개를 뺐습니다. ${invalid.join(" / ")}`;
}
renderHome();
</script>
</body>
</html>
